site_name: Guestbook Containerisation
site_description: Architecture and design decisions for the containerised SvelteKit + PostgreSQL guestbook.
site_author: Victor Hyginus
site_url: https://icedmallard4334.github.io/Guestbook-in-Containers/
repo_url: https://github.com/IcedMallard4334/Guestbook-in-Containers
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - Running and testing: running.md
  - Docker concepts: docker-concepts.md
  - AI declaration: ai-declaration.md
